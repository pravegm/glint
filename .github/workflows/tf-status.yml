name: TestFlight build status

# Read-only: asks App Store Connect for Glint's latest builds and their processing state (PROCESSING, VALID,
# INVALID, FAILED), so "I can't see build N in TestFlight" can be answered without the founder opening the website.
# Uses the same ASC_* secrets as testflight.yml; the key is written to a temp file and never echoed.

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID: com.pravegm.glint
    steps:
      - name: Query App Store Connect
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600,
               "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {token}"}
          api = "https://api.appstoreconnect.apple.com/v1"
          app = requests.get(f"{api}/apps", headers=h, params={"filter[bundleId]": os.environ["BUNDLE_ID"]}).json()["data"][0]
          builds = requests.get(f"{api}/builds", headers=h, params={
              "filter[app]": app["id"], "sort": "-uploadedDate", "limit": 10,
              "include": "preReleaseVersion,buildBetaDetail"}).json()
          versions = {i["id"]: i["attributes"].get("version") for i in builds.get("included", []) if i["type"] == "preReleaseVersions"}
          beta = {i["id"]: i["attributes"] for i in builds.get("included", []) if i["type"] == "buildBetaDetails"}
          lines = ["| Build | Uploaded | Processing | Internal testing | Expired |", "|---|---|---|---|---|"]
          for b in builds["data"]:
              a = b["attributes"]
              v = versions.get(b["relationships"]["preReleaseVersion"]["data"]["id"], "?")
              d = beta.get((b["relationships"].get("buildBetaDetail", {}).get("data") or {}).get("id"), {})
              lines.append(f"| {v} ({a['version']}) | {a['uploadedDate']} | {a['processingState']} | "
                           f"{d.get('internalBuildState', '?')} | {a['expired']} |")
          # R4: an upload Apple accepted but that never became a build (rejected in processing, or still being
          # ingested) only shows up here: the app's build uploads with their state and any errors/warnings.
          bu = requests.get(f"{api}/apps/{app['id']}/buildUploads", headers=h, params={"limit": 10})
          lines += ["", f"Build uploads (HTTP {bu.status_code}):"]
          try:
              for u in bu.json().get("data", []):
                  ua = u.get("attributes", {})
                  st = ua.get("state") or {}
                  lines.append(f"- {ua.get('cfBundleShortVersionString')} ({ua.get('cfBundleVersion')}) "
                               f"uploaded {ua.get('uploadedDate') or ua.get('createdDate')}: "
                               f"{st.get('state') if isinstance(st, dict) else st}")
                  if isinstance(st, dict):
                      for kind in ("errors", "warnings", "infos"):
                          for e in st.get(kind) or []:
                              lines.append(f"    {kind[:-1]}: {e.get('code')} {e.get('description') or e.get('message')}")
              if bu.status_code != 200:
                  lines.append("    " + bu.text[:600])
          except Exception as ex:
              lines.append(f"    (could not read: {ex}) {bu.text[:400]}")
          out = "\n".join(lines)
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Glint builds in App Store Connect\n\n" + out + "\n")
          PY
