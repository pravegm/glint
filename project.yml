# XcodeGen spec (brew install xcodegen && xcodegen generate). Glint.xcodeproj, scheme Glint, app Glint.app.
# Orientations: every one is listed; the layout follows the canvas (GardenLayout), so nothing is ever letterboxed.
name: Glint
options:
  bundleIdPrefix: com.pravegm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set in Xcode > Signing & Capabilities, or by testflight.yml
targets:
  Glint:
    type: application
    platform: iOS
    sources:
      - path: Glint
    info:
      path: Glint/Info.plist
      properties:
        CFBundleDisplayName: Glint
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        GKGameCenterBadgingDisabled: true
    entitlements:
      path: Glint/Glint.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pravegm.glint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  GlintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GlintTests
    dependencies:
      - target: Glint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Glint:
    build:
      targets:
        Glint: all
        GlintTests: [test]
    test:
      targets:
        - GlintTests
